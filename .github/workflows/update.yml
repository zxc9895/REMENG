name: 更新热榜

on:
  schedule:
    - cron: '17 * * * *' # 每小时第 17 分钟跑一次（避开整点高峰；GitHub 繁忙时可能延迟）
  workflow_dispatch: # 允许在 Actions 页面手动点“Run workflow”
  push:
    paths-ignore:
      - 'data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-hot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5

      - name: 测试解析逻辑
        run: node scripts/test.mjs

      # 数据每小时更新，但一天只提交一次到仓库，所以先从线上网站取回最新的一份
      - name: 取回上次的数据
        run: node scripts/restore.mjs "${{ steps.pages.outputs.base_url }}"

      - name: 抓取热榜
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          REGION: ${{ vars.REGION || 'US' }}
        run: node scripts/fetch.mjs

      # 每天北京时间 23 点那次（或手动/推送触发时）把数据存进仓库备份
      - name: 提交数据（每天一次）
        run: |
          hour=$(TZ=Asia/Shanghai date +%H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$hour" != "23" ]; then
            echo "北京时间 ${hour} 点，只更新网站，不提交"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "数据没有变化"; exit 0; fi
          git commit -m "chore: 更新热榜数据 $(TZ=Asia/Shanghai date +'%F %H:%M')"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # 给 app.js / style.css 加版本号，代码更新后浏览器会直接拿新版，不用强制刷新
      - name: 整理要发布的文件
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/
          v=${GITHUB_SHA::7}
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html
          grep -o '\(style.css\|app.js\)?v=[0-9a-f]*' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
